[project]
name = "telegram-documentaries"
version = "0.1.0"
description = "Send a portrait photo; get a narrated wildlife documentary back — as a Telegram voice note."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "google-generativeai>=0.8.6",
    "google-genai>=1.0",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[project.scripts]
telegram-documentaries = "telegram_documentaries.gateway:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_documentaries"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
pretty = true
